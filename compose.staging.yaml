name: check-in

x-app: &app
  # IMAGE_REPO is set by the deploy workflow from github.repository, so a repo
  # rename or transfer cannot leave this pointing at a stale GHCR package.
  image: ${IMAGE_REPO:-ghcr.io/juanplazadev/check-in-v2}:${IMAGE_TAG:-latest}
  env_file: [.env]
  restart: unless-stopped
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend]

services:
  checkin:
    <<: *app
    environment:
      OCTANE_SERVER: frankenphp
      OCTANE_HTTPS: "false"
    networks: [proxy, backend]   # proxy = reachable by Caddy as check-in-checkin-1:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  horizon:
    <<: *app
    command: php artisan horizon
    # Exceed the longest supervisor job timeout (the exports supervisor's 600s)
    # so in-flight jobs finish on the SIGTERM sent when this container is
    # recreated during deploy, rather than being killed mid-render. Only an
    # export actually running holds a deploy up this long.
    stop_grace_period: 620s

  scheduler:
    <<: *app
    command: php artisan schedule:work

  tailscale:
    image: tailscale/tailscale:stable
    hostname: svc-g6p4
    restart: unless-stopped
    environment:
      # Not ${TS_AUTHKEY:?...} on purpose - a missing key should not fail an app
      # deploy. After first auth the tsstate volume keeps the node registered.
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: svc-g6p4
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:checkin-horizon
    volumes:
      - tsstate:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
    depends_on: [checkin]
    networks: [backend]

  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${APP_TIMEZONE:-UTC}
      PGTZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  tsstate:
